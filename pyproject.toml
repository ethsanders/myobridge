[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myobridge"
dynamic = ["version"]
description = "Stream multi-channel EMG from an ESP32 over UDP, clean it in real time, and turn muscle activity into gestures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ethan Sanders" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]
keywords = ["emg", "electromyography", "myoelectric", "bci", "neurotech", "esp32", "signal-processing", "gesture-recognition", "xr", "wearables"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ethsanders/myobridge"
Documentation = "https://ethsanders.github.io/myobridge/"
"Live demo" = "https://ethsanders.github.io/myobridge/demo/"
Source = "https://github.com/ethsanders/myobridge"
Issues = "https://github.com/ethsanders/myobridge/issues"
Changelog = "https://github.com/ethsanders/myobridge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
lsl = ["pylsl>=1.16"]
bench = ["matplotlib>=3.6", "scikit-learn>=1.2"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.8",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "pylsl>=1.16",
]

[project.scripts]
myobridge = "myobridge.cli:main"

[tool.hatch.version]
path = "src/myobridge/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/firmware",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myobridge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Code blocks in the docs hold snippet includes and aligned comments.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"  # numpy 2.3+ stubs; runtime support is still 3.10+
strict = true
files = ["src/myobridge"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "sklearn.*", "pylsl.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["myobridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90  # CI fails if coverage drops below this
exclude_also = ["if __name__ == .__main__.:"]
