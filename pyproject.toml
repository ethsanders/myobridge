[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myobridge"
version = "0.1.0"
description = "Stream multi-channel EMG from an ESP32 over UDP, clean it in real time, and turn muscle activity into gestures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ethan Sanders" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]
keywords = ["emg", "bci", "esp32", "signal-processing", "gesture-recognition", "xr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.8",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
]

[project.scripts]
myobridge = "myobridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myobridge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"  # numpy 2.x stubs need it; runtime support is still 3.10+
strict = true
files = ["src/myobridge"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["myobridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90  # CI fails if coverage drops below this
exclude_also = ["if __name__ == .__main__.:"]
