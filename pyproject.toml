[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myobridge"
version = "0.1.0"
description = "Stream multi-channel EMG from an ESP32 over UDP, clean it in real time, and turn muscle activity into gestures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ethan Sanders" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]
keywords = ["emg", "bci", "esp32", "signal-processing", "gesture-recognition", "xr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
myobridge = "myobridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myobridge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
