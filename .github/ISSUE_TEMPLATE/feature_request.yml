name: Idea or feature request
description: Something myobridge should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem first, then the feature you have in mind, if any.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Links to papers, datasets or similar projects help.
