name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (strict)
        # The numpy that installs on 3.10 and 3.11 is older and ships different
        # type stubs, so strict typing is checked on 3.12+ only. Tests still run
        # on every version.
        if: matrix.python-version == '3.12' || matrix.python-version == '3.13'
        run: mypy
      - name: Test (includes firmware host tests, built with g++)
        env:
          MYOBRIDGE_REQUIRE_CXX: "1"
        run: pytest -q --cov=myobridge --cov-report=term --cov-report=xml
      - name: Demo smoke test (simulator)
        run: myobridge demo --train-seconds 4 --repeats 1
      - name: Latency benchmark (no data needed)
        run: myobridge bench latency --quick --no-figures --out /tmp/results

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oversample: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core (3.x)
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile sketch (OVERSAMPLE=${{ matrix.oversample }})
        run: |
          cd firmware/esp32_emg_streamer
          sed "s/^#define OVERSAMPLE 1$/#define OVERSAMPLE ${{ matrix.oversample }}/" config.example.h > config.h
          grep "^#define OVERSAMPLE" config.h
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all .
